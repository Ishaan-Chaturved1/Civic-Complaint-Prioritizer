version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: civic_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: civic_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: civic_backend
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/civic_db
      - JWT_SECRET=production-secret-civic-ai-2026
      - UPLOAD_DIR=/app/uploads
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
      - ../models:/models

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: civic_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
  uploads_data:
